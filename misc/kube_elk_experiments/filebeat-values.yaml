# filebeat-values.yaml
# правильный формат для elastic/filebeat

# ServiceAccount и RBAC
serviceAccount:
  create: true
  name: filebeat

rbac:
  create: true

# filebeat.yml (ConfigMap)
filebeatConfig:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          templates:
            - condition:
                equals:
                  kubernetes.namespace: "web-services"
              config:
                - type: container
                  containers.ids:
                    - ${data.kubernetes.container.id}
                  multiline.pattern: '^\s'
                  multiline.negate: false
                  multiline.match: after

    processors:
      - add_kubernetes_metadata:
          in_cluster: true
      - add_host_metadata: {}
      - add_cloud_metadata: {}

    logging.level: info

    output.elasticsearch:
      hosts: ["http://elasticsearch-master.logging.svc.cluster.local:9200"]
      username: "${ELASTIC_USERNAME}"
      password: "${ELASTIC_PASSWORD}"

# credentials → через secret
extraEnvs:
  - name: ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elastic-credentials
        key: username
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elastic-credentials
        key: password

daemonset:
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
    limits:
      memory: 400Mi
      cpu: 500m

image:
  tag: "8.10.0"
  pullPolicy: IfNotPresent
