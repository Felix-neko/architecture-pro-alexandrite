# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: web-services
---
# Headless Service (для стабильных DNS-имён подов)
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
  namespace: web-services
  labels:
    app: nginx-stateful
spec:
  clusterIP: None
  selector:
    app: nginx-stateful
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# StatefulSet с nginx
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx
  namespace: web-services
  labels:
    app: nginx-stateful
spec:
  serviceName: nginx-headless
  replicas: 1
  selector:
    matchLabels:
      app: nginx-stateful
  template:
    metadata:
      labels:
        app: nginx-stateful
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
# NodePort Service для доступа снаружи
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: web-services
  labels:
    app: nginx-stateful
spec:
  type: NodePort
  selector:
    app: nginx-stateful
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
