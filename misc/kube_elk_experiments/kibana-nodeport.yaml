apiVersion: v1
kind: Service
metadata:
  name: kibana-nodeport
  namespace: logging
  labels:
    app: kibana
    service-type: nodeport
spec:
  type: NodePort
  ports:
  - name: http
    port: 5601
    targetPort: 5601
    nodePort: 30001
    protocol: TCP
  selector:
    app: kibana
    release: kibana
