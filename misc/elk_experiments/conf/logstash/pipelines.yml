# Конфигурация pipeline для обработки логов Nginx
# Уникальный идентификатор pipeline для мониторинга и управления
- pipeline.id: nginx_logs
  # Количество worker потоков для обработки данных в этом pipeline
  # 1 поток подходит для небольших нагрузок
  pipeline.workers: 1
  # Размер batch для группировки событий перед обработкой
  # Меньший размер = меньшая задержка, больший = выше производительность
  pipeline.batch.size: 1
  # Путь к файлу конфигурации pipeline с правилами обработки
  path.config: "/usr/share/logstash/config/pipelines/nginx.conf"